# A股初选与推荐池（公开数据，零付费）
version: 2

insider_days: 90
min_upside: 0.30
# 综合估值分门槛（PE/增速/PB/PEG）；不再用一年价格分位作硬门槛
min_valuation_score: 55
price_lookback: 250
pool_size: 30
exclude_st: true

# 综合评分权重（归一化）；undervalue=综合估值分，insider=所有权信号强度
weights:
  undervalue: 0.30
  upside: 0.25
  insider: 0.20
  research: 0.15
  risk: 0.10

# 研报分页上限（防超时）
report_max_pages: 40
report_page_size: 100
insider_page_size: 500

disclosure: >
  入池条件：近90日所有权信号（高管增持或公司回购或大股东增持计划）
  ∩ 研报目标价/隐含目标价上行≥30% ∩ 综合估值分达标。
  目标价优先用卖方显式目标价，否则用一致预期 EPS×PE 隐含；
  综合估值综合 PE_TTM、业绩增速、PB、PEG，一年价格分位仅作弱参考。
  仅供个人研究，不构成投资建议。
